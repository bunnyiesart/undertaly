    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
    <script src="c2runtime.js"></script>
    <script>
        // Start the Construct 2 project running on window load.
        jQuery(document).ready(function() {
            console.log("[Antigravity] Overriding Audio, Layout, and Function triggers...");

            // Global Audio instance tracker for runtime-wide control
            window.audioInstance = null;
            window.fightStarted = false;

            var getAudioInstance = function(runtime) {
                if (window.audioInstance) return window.audioInstance;
                if (runtime && runtime.types && runtime.types.Audio && runtime.types.Audio.instances && runtime.types.Audio.instances.length) {
                    return runtime.types.Audio.instances[0];
                }
                if (runtime && runtime.all_groups) {
                    for (var i = 0; i < runtime.all_groups.length; i++) {
                        var instances = runtime.all_groups[i];
                        if (instances && instances.length) {
                            for (var j = 0; j < instances.length; j++) {
                                if (instances[j].type && instances[j].type.name === "Audio") {
                                    return instances[j];
                                }
                            }
                        }
                    }
                }
                return null;
            };

            // Override Function plugin to support \n replacements and automatic wrapping in SansText parameters
            if (window.cr && cr.plugins_ && cr.plugins_.Function && cr.plugins_.Function.prototype && cr.plugins_.Function.prototype.acts) {
                var originalCallFunction = cr.plugins_.Function.prototype.acts.CallFunction;
                
                var wrapSpeechBubbleText = function(text, maxLen) {
                    if (!text) return "";
                    // Replaces literal "\n" strings (e.g. from raw CSV or code) with real newlines first
                    text = text.replace(/\\n/g, "\n");
                    
                    var lines = text.split("\n");
                    var resultLines = [];
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line.length <= maxLen) {
                            resultLines.push(line);
                        } else {
                            var words = line.split(/\s+/);
                            var currentLine = "";
                            for (var j = 0; j < words.length; j++) {
                                var word = words[j];
                                if (!word) continue;
                                if (currentLine === "") {
                                    currentLine = word;
                                } else if ((currentLine + " " + word).length <= maxLen) {
                                    currentLine += " " + word;
                                } else {
                                    resultLines.push(currentLine);
                                    currentLine = word;
                                }
                            }
                            if (currentLine !== "") {
                                resultLines.push(currentLine);
                            }
                        }
                    }
                    return resultLines.join("\n");
                };

                cr.plugins_.Function.prototype.acts.CallFunction = function(name_, params_) {
                    if (params_ && params_.length) {
                        for (var i = 0; i < params_.length; i++) {
                            if (typeof params_[i] === "string") {
                                if (name_ === "SansText") {
                                    params_[i] = wrapSpeechBubbleText(params_[i], 16);
                                    
                                    // Stop dialog music and start Megalovania early when "bad time" is displayed
                                    if (params_[i].includes("bad time") && !window.fightStarted) {
                                        console.log("[Antigravity] 'bad time' detected in SansText! Transitioning to Megalovania early...");
                                        window.fightStarted = true;
                                        var audioInst = getAudioInstance(this.runtime);
                                        if (audioInst) {
                                            try {
                                                if (cr.plugins_.Audio.prototype.acts.Stop) {
                                                    cr.plugins_.Audio.prototype.acts.Stop.call(audioInst, "Music");
                                                }
                                                cr.plugins_.Audio.prototype.acts.Play.call(audioInst, ["mus_zz_megalovania", true], 1, 0, "Music");
                                            } catch (e) {
                                                console.error("[Antigravity] Error playing Megalovania early: ", e);
                                            }
                                        }
                                    }
                                } else {
                                    params_[i] = params_[i].replace(/\\n/g, "\n");
                                }
                            }
                        }
                    }
                    originalCallFunction.call(this, name_, params_);
                };
            }
            // Custom tick override for dynamic Sans idle animations in the dialogue phase
            if (window.cr && cr.runtime && cr.runtime.prototype) {
                var originalTick = cr.runtime.prototype.tick;
                cr.runtime.prototype.tick = function() {
                    originalTick.apply(this, arguments);
                    if (this.running_layout && this.running_layout.name === "BattleScreen") {
                        var headType = this.types["SansHead"] || this.types["t24"];
                        var bodyType = this.types["SansBody"] || this.types["t25"];
                        var torsoType = this.types["SansTorso"] || this.types["t28"];
                        var legsType = this.types["SansLegs"] || this.types["t26"];

                        var headInst = headType && headType.instances && headType.instances[0];
                        var bodyInst = bodyType && bodyType.instances && bodyType.instances[0];
                        var torsoInst = torsoType && torsoType.instances && torsoType.instances[0];
                        var legsInst = legsType && legsType.instances && legsType.instances[0];

                        if (typeof window.sansDebugCounter === "undefined") {
                            window.sansDebugCounter = 0;
                        }
                        window.sansDebugCounter++;
                        if (window.sansDebugCounter % 180 === 0) {
                            console.log("[Antigravity Debug] Layout:", this.running_layout.name, 
                                        "| Head:", headInst ? "Found" : "Missing", 
                                        "| Body:", bodyInst ? "Found" : "Missing", 
                                        "| Torso:", torsoInst ? "Found" : "Missing", 
                                        "| Legs:", legsInst ? "Found" : "Missing",
                                        "| fightStarted:", window.fightStarted);
                        }

                        var parts = [];
                        if (headInst) parts.push({ inst: headInst, type: "head" });
                        if (bodyInst) parts.push({ inst: bodyInst, type: "body" });
                        if (torsoInst) parts.push({ inst: torsoInst, type: "torso" });
                        if (legsInst) parts.push({ inst: legsInst, type: "legs" });

                        if (!window.fightStarted) {
                            var t = this.kahanTime.sum; // Get the game time in seconds
                            
                            // Calculate offsets
                            var torsoY = Math.sin(t * 3.5) * 1.2;
                            var bodyY = torsoY;
                            var headY = Math.sin(t * 3.5 - 0.6) * 1.8;
                            var headX = Math.cos(t * 1.75) * 0.8;
                            var headAngle = Math.cos(t * 1.75) * 0.015;

                            parts.forEach(function(p) {
                                var inst = p.inst;
                                // Baseline sync logic
                                if (inst.baseX === undefined || inst.x !== inst.lastSetX) {
                                    inst.baseX = inst.x;
                                }
                                if (inst.baseY === undefined || inst.y !== inst.lastSetY) {
                                    inst.baseY = inst.y;
                                }
                                if (inst.baseAngle === undefined || inst.angle !== inst.lastSetAngle) {
                                    inst.baseAngle = inst.angle;
                                }

                                // Apply offsets based on part type
                                var ox = 0, oy = 0, oa = 0;
                                if (p.type === "torso") {
                                    oy = torsoY;
                                } else if (p.type === "body") {
                                    oy = bodyY;
                                } else if (p.type === "head") {
                                    ox = headX;
                                    oy = headY;
                                    oa = headAngle;
                                }

                                inst.x = inst.baseX + ox;
                                inst.y = inst.baseY + oy;
                                inst.angle = inst.baseAngle + oa;

                                // Save values
                                inst.lastSetX = inst.x;
                                inst.lastSetY = inst.y;
                                inst.lastSetAngle = inst.angle;
                            });
                        } else {
                            // If the fight has started, make sure we restore baseline positions once
                            parts.forEach(function(p) {
                                var inst = p.inst;
                                if (inst.baseX !== undefined) {
                                    inst.x = inst.baseX;
                                    inst.y = inst.baseY;
                                    inst.angle = inst.baseAngle || 0;
                                    delete inst.baseX;
                                    delete inst.baseY;
                                    delete inst.baseAngle;
                                    delete inst.lastSetX;
                                    delete inst.lastSetY;
                                    delete inst.lastSetAngle;
                                }
                            });
                        }
                    }
                };
            }

            // Reset fightStarted flag on layout start / restart actions
            if (window.cr && cr.system_object && cr.system_object.prototype) {
                if (cr.system_object.prototype.cnds && cr.system_object.prototype.cnds.OnLayoutStart) {
                    var originalOnLayoutStart = cr.system_object.prototype.cnds.OnLayoutStart;
                    cr.system_object.prototype.cnds.OnLayoutStart = function() {
                        console.log("[Antigravity] OnLayoutStart triggered. Resetting fightStarted = false");
                        window.fightStarted = false;
                        return originalOnLayoutStart.apply(this, arguments);
                    };
                }
                
                if (cr.system_object.prototype.acts) {
                    if (cr.system_object.prototype.acts.GoToLayout) {
                        var originalGoToLayout = cr.system_object.prototype.acts.GoToLayout;
                        cr.system_object.prototype.acts.GoToLayout = function(to) {
                            console.log("[Antigravity] GoToLayout triggered. Resetting fightStarted = false");
                            window.fightStarted = false;
                            return originalGoToLayout.apply(this, arguments);
                        };
                    }
                    if (cr.system_object.prototype.acts.RestartLayout) {
                        var originalRestartLayout = cr.system_object.prototype.acts.RestartLayout;
                        cr.system_object.prototype.acts.RestartLayout = function() {
                            console.log("[Antigravity] RestartLayout triggered. Resetting fightStarted = false");
                            window.fightStarted = false;
                            return originalRestartLayout.apply(this, arguments);
                        };
                    }
                }
            } else {
                console.error("[Antigravity] cr.system_object.prototype not found!");
            }

            // Override Audio actions for intro vs fight music transition
            if (window.cr && cr.plugins_ && cr.plugins_.Audio) {
                var originalPlay = cr.plugins_.Audio.prototype.acts.Play;
                cr.plugins_.Audio.prototype.acts.Play = function(file, looping, vol, tag) {
                    window.audioInstance = this;
                    var filename = file ? file[0] : "unknown";
                    console.log("[Antigravity] acts.Play called for file: " + filename + ", looping: " + looping + ", tag: " + tag + ", fightStarted: " + window.fightStarted);
                    
                    if (this.runtime.running_layout && this.runtime.running_layout.name !== "BattleScreen") {
                        console.log("[Antigravity] Running layout is not BattleScreen (" + this.runtime.running_layout.name + "), resetting fightStarted = false");
                        window.fightStarted = false;
                    }
                    if (file && file[0] === "mus_zz_megalovania" && !window.fightStarted) {
                        console.log("[Antigravity] Redirecting mus_zz_megalovania to mus_intro");
                        file = ["mus_intro", true];
                    }
                    try {
                        originalPlay.call(this, file, looping, vol, tag);
                    } catch (e) {
                        console.error("[Antigravity] Error in acts.Play: ", e);
                    }
                };

                var originalPreload = cr.plugins_.Audio.prototype.acts.Preload;
                cr.plugins_.Audio.prototype.acts.Preload = function(file) {
                    window.audioInstance = this;
                    var filename = file ? file[0] : "unknown";
                    console.log("[Antigravity] acts.Preload called for file: " + filename);
                    if (file && file[0] === "mus_zz_megalovania" && !window.fightStarted) {
                        console.log("[Antigravity] Preloading megalovania at start, triggering mus_intro play");
                        try {
                            cr.plugins_.Audio.prototype.acts.Play.call(this, ["mus_intro", true], 1, 0, "Music");
                        } catch (e) {
                            console.error("[Antigravity] Error playing mus_intro during preload: ", e);
                        }
                    }
                    originalPreload.call(this, file);
                };

                var originalPlayByName = cr.plugins_.Audio.prototype.acts.PlayByName;
                cr.plugins_.Audio.prototype.acts.PlayByName = function(folder, filename, looping, vol, tag) {
                    window.audioInstance = this;
                    console.log("[Antigravity] acts.PlayByName called for file: " + filename + ", tag: " + tag + ", fightStarted: " + window.fightStarted);
                    
                    if (this.runtime.running_layout && this.runtime.running_layout.name !== "BattleScreen") {
                        window.fightStarted = false;
                    }
                    var lowerName = (filename || "").toLowerCase();
                    if ((lowerName === "gasterblaster" || lowerName === "flash") && !window.fightStarted) {
                        console.log("[Antigravity] Flash or GasterBlaster detected! Transitioning fightStarted = true, stopping Music tag and starting Megalovania loop");
                        window.fightStarted = true;
                        try {
                            if (cr.plugins_.Audio.prototype.acts.Stop) {
                                cr.plugins_.Audio.prototype.acts.Stop.call(this, "Music");
                            }
                            originalPlay.call(this, ["mus_zz_megalovania", true], 1, 0, "Music");
                        } catch (e) {
                            console.error("[Antigravity] Error stopping/playing music: ", e);
                        }
                    }
                    try {
                        originalPlayByName.call(this, folder, filename, looping, vol, tag);
                    } catch (e) {
                        console.error("[Antigravity] Error in acts.PlayByName: ", e);
                    }
                };
                console.log("[Antigravity] Overrides injected successfully.");
            } else {
                console.error("[Antigravity] cr.plugins_.Audio not found!");
            }

            // Create new runtime using the c2canvas
            cr_createRuntime("c2canvas");
        });

        // Pause and resume on page becoming visible/invisible
        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
                cr_setSuspended(true);
            else
                cr_setSuspended(false);
        };

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

        function OnRegisterSWError(e) {
            console.warn("Failed to register service worker: ", e);
        };

        // Runtime calls this global method when ready to start caching (i.e. after startup).
        // This registers the service worker which caches resources for offline support.
        window.C2_RegisterSW = function C2_RegisterSW() {
            if (!navigator.serviceWorker)
                return;
            try {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            } catch (e) {
                console.warn(e);
            }
        };
    </script>
