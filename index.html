    <script>
        // Start the Construct 2 project running on window load.
        jQuery(document).ready(function() {
            // Reset fightStarted flag on layout start (e.g. game over restart)
            if (window.cr && cr.system_object && cr.system_object.prototype && cr.system_object.prototype.cnds) {
                var originalOnLayoutStart = cr.system_object.prototype.cnds.OnLayoutStart;
                cr.system_object.prototype.cnds.OnLayoutStart = function() {
                    window.fightStarted = false;
                    return originalOnLayoutStart.apply(this, arguments);
                };
            }

            // Override Audio actions for intro vs fight music transition
            if (window.cr && cr.plugins_ && cr.plugins_.Audio) {
                window.fightStarted = false;
                
                var originalPlay = cr.plugins_.Audio.prototype.acts.Play;
                cr.plugins_.Audio.prototype.acts.Play = function(file, looping, vol, tag) {
                    if (this.runtime.running_layout && this.runtime.running_layout.name !== "Battle") {
                        window.fightStarted = false;
                    }
                    if (file && file[0] === "mus_zz_megalovania" && !window.fightStarted) {
                        file = ["mus_intro", true];
                    }
                    originalPlay.call(this, file, looping, vol, tag);
                };

                var originalPlayByName = cr.plugins_.Audio.prototype.acts.PlayByName;
                cr.plugins_.Audio.prototype.acts.PlayByName = function(folder, filename, looping, vol, tag) {
                    if (this.runtime.running_layout && this.runtime.running_layout.name !== "Battle") {
                        window.fightStarted = false;
                    }
                    var lowerName = (filename || "").toLowerCase();
                    if ((lowerName === "gasterblaster" || lowerName === "flash") && !window.fightStarted) {
                        window.fightStarted = true;
                        if (cr.plugins_.Audio.prototype.acts.Stop) {
                            cr.plugins_.Audio.prototype.acts.Stop.call(this, "Music");
                        }
                        originalPlay.call(this, ["mus_zz_megalovania", true], 1, 0, "Music");
                    }
                    originalPlayByName.call(this, folder, filename, looping, vol, tag);
                };
            }

            // Create new runtime using the c2canvas
            cr_createRuntime("c2canvas");
        });

        // Pause and resume on page becoming visible/invisible
        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
                cr_setSuspended(true);
            else
                cr_setSuspended(false);
        };

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

        function OnRegisterSWError(e) {
            console.warn("Failed to register service worker: ", e);
        };

        // Runtime calls this global method when ready to start caching (i.e. after startup).
        // This registers the service worker which caches resources for offline support.
        window.C2_RegisterSW = function C2_RegisterSW() {
            if (!navigator.serviceWorker)
                return;
            try {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            } catch (e) {
                console.warn(e);
            }
        };
